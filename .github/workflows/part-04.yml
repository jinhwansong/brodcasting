name: Part 04 authentication verification
on:
  push:
    branches: [main, courseware/part-04-ci]
    paths:
      - '.github/workflows/part-04.yml'
      - 'labs/part-04/**'
      - 'reference-solutions/part-04/**'
      - 'checks/part-04/**'
      - 'checks/part-00/engines.test.mjs'
      - 'package*.json'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: brodcasting_part04_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - name: Actual PostgreSQL and password checks
        env:
          PART04_TEST_ADMIN_URL: postgres://postgres:local-ci-only@127.0.0.1:5432/brodcasting_part04_test
        run: npm run check:reference:part-04
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: part-04-verification
          path: test-results/part-04/
          if-no-files-found: error
          retention-days: 14

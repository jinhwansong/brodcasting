name: Runtime and frontend security courseware
on:
  push:
    branches: [main, codex/part-07-11-courseware]
    paths:
      - '.github/workflows/runtime-security.yml'
      - 'labs/runtime-*/**'
      - 'reference-solutions/runtime-*/**'
      - 'checks/runtime-*/**'
      - 'labs/security-f*/**'
      - 'reference-solutions/security-f*/**'
      - 'checks/security-f*/**'
      - 'checks/courseware-standalone.mjs'
      - 'package*.json'
  pull_request:
    paths:
      - '.github/workflows/runtime-security.yml'
      - 'labs/runtime-*/**'
      - 'reference-solutions/runtime-*/**'
      - 'checks/runtime-*/**'
      - 'labs/security-f*/**'
      - 'reference-solutions/security-f*/**'
      - 'checks/security-f*/**'
      - 'checks/courseware-standalone.mjs'
permissions:
  contents: read
jobs:
  new-courses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        course: [runtime-05, runtime-06, runtime-07, security-f1, security-f2, security-f3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '24.19.0'}
      - run: npm --prefix reference-solutions/${{ matrix.course }} ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix reference-solutions/${{ matrix.course }} run check
      - run: npm run verify:${{ matrix.course }}:standalone
      - if: matrix.course == 'runtime-06'
        run: npm --prefix reference-solutions/runtime-06 run measure
      - if: matrix.course == 'runtime-07'
        run: node reference-solutions/runtime-07/checks/recovery.mjs
  runtime-01:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '24.19.0'}
      - run: node checks/runtime-01/run.mjs reference
      - run: npm run verify:runtime-01:standalone
      - run: node reference-solutions/runtime-01/src/experiment.mjs 1000000
  runtime-02:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '24.19.0'}
      - run: npm --prefix reference-solutions/runtime-02 ci
      - run: npm --prefix reference-solutions/runtime-02 run check
      - run: npm run verify:runtime-02:standalone
  runtime-03:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '24.19.0'}
      - run: npm --prefix reference-solutions/runtime-03 ci --ignore-scripts
      - run: npm --prefix reference-solutions/runtime-03 run check
      - run: npm run verify:runtime-03:standalone
  runtime-04:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: '24.19.0'}
      - run: npm --prefix reference-solutions/runtime-04 ci --ignore-scripts
      - run: npm --prefix reference-solutions/runtime-04 run check
      - run: npm run verify:runtime-04:standalone

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PART06_ADMIN_PASSWORD:?Set PART06_ADMIN_PASSWORD in .env}
      POSTGRES_DB: brodcasting_part06_lab
    ports:
      - "127.0.0.1:5546:5432"
    volumes:
      - part06-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brodcasting_part06_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  part06-db:
